server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          #despues de configurar la url en apiconfig se debe poner x forwarded, prefix enabled
          x-forwarded:
            prefix-enabled: true
          routes:
            # ---------- RUTA 1: hacia servicio-a ----------
            # El contexto público (/api) lo pone el Gateway; servicio-a solo conoce /saludo
            - id: ruta-pacientes
              uri: lb://pacientes
              predicates:
                - Path=/api/pacientes/**
              filters:
                - StripPrefix=2

            # ---------- RUTA 2 (opcional): hacia servicio-b ----------
            - id: ruta-medicos
              uri: lb://medicos
              predicates:
                - Path=/api/medicos/**
              filters:
                - StripPrefix=2

            # ---------- RUTA 3 (opcional): hacia citas ----------
            - id: ruta-citas
              uri: lb://citas
              predicates:
                - Path=/api/citas/**
              filters:
                - StripPrefix=2
      #para encender el balanceador de cargas de swagger
    loadbalancer:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true   # Registrarse con la IP y no con el nombre de host